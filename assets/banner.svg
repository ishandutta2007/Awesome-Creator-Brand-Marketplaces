<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="linePulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8">
        <animate attributeName="stop-opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .floating-pill-1 {
        animation: floatA 6s ease-in-out infinite alternate;
      }
      .floating-pill-2 {
        animation: floatB 7s ease-in-out infinite alternate;
      }
      .floating-pill-3 {
        animation: floatC 8s ease-in-out infinite alternate;
      }
      .pulse-circle {
        animation: pulseScale 3s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .orbit-dot {
        animation: orbit 10s linear infinite;
        transform-origin: 600px 160px;
      }
      @keyframes floatA {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(-12px) translateX(6px); }
      }
      @keyframes floatB {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(14px) translateX(-8px); }
      }
      @keyframes floatC {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(-10px) translateX(-10px); }
      }
      @keyframes pulseScale {
        0% { transform: scale(0.95); opacity: 0.6; }
        100% { transform: scale(1.05); opacity: 1; }
      }
    </style>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="320" rx="16" fill="none" stroke="#1f2937" stroke-width="2" />

  <!-- 2. Dynamic Background Wave & Connecting Lines -->
  <g opacity="0.4">
    <!-- Connecting flow curve 1 -->
    <path d="M 0 160 C 300 280, 450 60, 750 180 C 950 260, 1080 120, 1200 160" fill="none" stroke="url(#linePulse)" stroke-width="3" />
    <path d="M 0 200 C 250 80, 500 270, 800 120 C 1000 40, 1100 240, 1200 200" fill="none" stroke="url(#purpleGradient)" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="0" to="120" dur="15s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- 3. Animated Glowing Ambient Orbs (Kept behind foreground) -->
  <circle cx="150" cy="80" r="90" fill="#8b5cf6" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="80;105;80" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1060" cy="240" r="110" fill="#06b6d4" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="100;125;100" dur="9s" repeatCount="indefinite" />
  </circle>

  <!-- 4. Background Decorative Animated Chips / Badges (positioned on wings, clear of center text) -->
  <!-- Left Side Badges -->
  <g class="floating-pill-1" opacity="0.85">
    <rect x="50" y="55" width="160" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="68" cy="72" r="6" fill="#10b981" />
    <text x="82" y="77" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Brand Discovery</text>
  </g>

  <g class="floating-pill-2" opacity="0.85">
    <rect x="80" y="235" width="170" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="98" cy="252" r="6" fill="#3b82f6" />
    <text x="112" y="257" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Affiliate Attribution</text>
  </g>

  <!-- Right Side Badges -->
  <g class="floating-pill-3" opacity="0.85">
    <rect x="990" y="60" width="165" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="1008" cy="77" r="6" fill="#ec4899" />
    <text x="1022" y="82" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Creator CRM &amp; Pay</text>
  </g>

  <g class="floating-pill-1" opacity="0.85">
    <rect x="960" y="230" width="180" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="978" cy="247" r="6" fill="#f59e0b" />
    <text x="992" y="252" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Open-Source Ready</text>
  </g>

  <!-- Connecting Node Pulses -->
  <circle cx="280" cy="155" r="4" fill="#06b6d4" filter="url(#subtleGlow)">
    <animate attributeName="r" values="3;6;3" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="920" cy="165" r="4" fill="#ec4899" filter="url(#subtleGlow)">
    <animate attributeName="r" values="3;6;3" dur="2.8s" repeatCount="indefinite" />
  </circle>

  <!-- 5. Foreground Content (Title, Subtitle & Status Badge) - Fully isolated from animation interference -->
  <g id="foreground-content">
    <!-- Top Category Pill -->
    <rect x="475" y="42" width="250" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <text x="600" y="60" text-anchor="middle" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM DIRECTORY</text>

    <!-- Main Title -->
    <text x="600" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Creator-Brand Marketplaces
    </text>

    <!-- Dynamic Gradient Underline Accent -->
    <rect x="420" y="146" width="360" height="3" rx="1.5" fill="url(#purpleGradient)">
      <animate attributeName="width" values="320;380;320" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x" values="440;410;440" dur="5s" repeatCount="indefinite" />
    </rect>

    <!-- Subtitle Line 1 -->
    <text x="600" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#e2e8f0">
      Enterprise SaaS Platforms &amp; Self-Hostable Open-Source Solutions
    </text>

    <!-- Subtitle Line 2 -->
    <text x="600" y="218" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      Creator Discovery • Influencer Marketing • Affiliate Attribution • Campaign Management • Payouts
    </text>

    <!-- Bottom Feature Tags -->
    <g transform="translate(365, 252)">
      <rect x="0" y="0" width="145" height="24" rx="12" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="72" y="16" text-anchor="middle" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Verified Pricing Tiers</text>

      <rect x="155" y="0" width="160" height="24" rx="12" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="235" y="16" text-anchor="middle" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Live Star Counts</text>

      <rect x="325" y="0" width="145" height="24" rx="12" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="397" y="16" text-anchor="middle" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Market Dynamics</text>
    </g>
  </g>
</svg>
